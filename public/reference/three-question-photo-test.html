<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好照片三问｜摄影速查卡</title>
  <link rel="stylesheet" href="../assets/course.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">随身速查卡 · v1</p>
    <h1>好照片<br>只问三件事</h1>
    <p class="deck">不是判断艺术高低的定律，而是一套让初学者快速看出“下一步该改哪里”的工作方法。</p>

    <section class="formula" aria-label="好照片三问">
      <div><span class="number">01</span><h3>主体</h3><p>第一眼落在哪里？如果没有答案，靠近、换角度或等待。</p></div>
      <div><span class="number">02</span><h3>秩序</h3><p>四条边是否都在帮主体？移除抢眼、重叠和无意义的残片。</p></div>
      <div><span class="number">03</span><h3>时机</h3><p>为什么偏偏是这一刻？等动作、表情、光线或关系到位。</p></div>
    </section>

    <div class="scorecard">
      <div>1 秒内能指出主体</div><div class="score">0 / 1</div>
      <div>边缘没有无意干扰</div><div class="score">0 / 1</div>
      <div>这一刻不可随便替换</div><div class="score">0 / 1</div>
    </div>

    <p class="callout">拍摄口诀：先选谁，再减谁，最后等谁。</p>
    <p class="small">2 分：值得保留并尝试后期。3 分：优先选片。0–1 分：先重拍，不要急着修。</p>

    <footer>
      返回 <a href="../lessons/0001-good-photo-three-questions.html">第 1 课：10 秒看懂一张照片</a>
    </footer>
  </main>
</body>
</html>
